# Weekly updates. Minor and patch updates merge themselves once the required checks pass
# (.github/workflows/dependabot-automerge.yml); majors wait for a person. The cooldown keeps a
# just-published version out for a few days, so auto-merge doesn't pull in a compromised release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # Every codeql-action step in a workflow must run the same version, or analyze fails
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Always raise the floor in package.json, so a production bump changes what users install rather than only the
    # lockfile (which npm does not publish).
    versioning-strategy: increase
    commit-message:
      # Production dependencies ship to users, so fix(deps) releases a patch. Development dependencies don't:
      # chore(deps-dev) cuts no release.
      prefix: fix
      prefix-development: chore
      include: scope
    labels:
      - dependencies
    groups:
      # coverage-v8 pins vitest as an exact peer, so they must move together. Listed first so it wins over the
      # groups below.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # The local test harness image (harness/Dockerfile). It pins the `synology` tag by digest, so updates arrive as
  # digest bumps. Nothing here ships to users, so chore(deps): no release.
  - package-ecosystem: docker
    directory: /harness
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
