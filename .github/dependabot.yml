version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # coverage-v8 pins vitest as an exact peer, so they must move together
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-patches:
        dependency-type: development
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
