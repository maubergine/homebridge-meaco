version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Always raise the floor in package.json, so a production bump changes what users install rather than only the
    # lockfile (which npm does not publish).
    versioning-strategy: increase
    commit-message:
      # Production dependencies ship to users, so fix → patch release. Dev dependencies don't, so chore → no release.
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    labels:
      - dependencies
    groups:
      # coverage-v8 pins vitest as an exact peer, so they must move together
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-patches:
        dependency-type: development
        update-types:
          - patch
