name: CodeQL

# Code scanning, advanced setup (the repository's default setup is turned off so the two don't both run).
# No merge_group: CodeQL isn't a required check, and uploads from merge-queue runs fail. Pull requests and pushes to
# main cover the code that lands.
# Scans the workflows and the repository's languages.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read # the workflow run's details, for the upload
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Each entry: a CodeQL language and its build mode. `none` for actions, javascript-typescript, python, ruby,
        # java-kotlin (Java only), csharp, rust; `autobuild` or `manual` for c-cpp, go, swift and Kotlin.
        # Swift runs on macOS; everything else on Ubuntu.
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
